name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # NFR-02: reproducibility is defined relative to a recorded thread configuration.
  # Pin it in CI so golden tests cannot flake on a differently-sized runner.
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.11
      - run: uv sync --frozen --all-extras

      - name: ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict on engine/ + schemas/, NFR-11)
        run: uv run mypy src/xlforecast
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: NFR-10 coverage floors
        run: |
          uv run coverage report --include="src/xlforecast/schemas/*" --fail-under=95
          # engine/, conformal.py and guardrail.py floors arrive with those modules (Phases 1-6).

  container:
    name: G0 container import gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (the G0 import gate runs inside the Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: xlforecast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the stack imports in the image
        run: |
          docker run --rm xlforecast:ci python -c "
          import statsforecast, mlforecast, utilsforecast
          print('statsforecast', statsforecast.__version__)
          print('mlforecast   ', mlforecast.__version__)
          print('utilsforecast', utilsforecast.__version__)
          "
