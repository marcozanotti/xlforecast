name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # NFR-02: reproducibility is defined relative to a recorded thread configuration.
  # Pin it in CI so golden tests cannot flake on a differently-sized runner.
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.11
      - run: uv sync --frozen --all-extras

      - name: ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict on engine/ + schemas/, NFR-11)
        run: uv run mypy src/xlforecast
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: NFR-10 coverage floors
        run: |
          uv run coverage report --include="src/xlforecast/schemas/*" --fail-under=95
          uv run coverage report --include="src/xlforecast/engine/*"  --fail-under=85
          uv run coverage report --include="src/xlforecast/ingest/*"  --fail-under=85
          uv run coverage report --include="src/xlforecast/storage/*" --fail-under=85
          uv run coverage report --include="src/xlforecast/api/*"     --fail-under=85
          uv run coverage report --include="src/xlforecast/worker/*"  --fail-under=85
          # NFR-10 names three modules at 100%. guardrail.py arrives in Phase 6 and adds
          # its line here when it lands.
          uv run coverage report --include="src/xlforecast/engine/folds.py"     --fail-under=100
          uv run coverage report --include="src/xlforecast/engine/conformal.py" --fail-under=100

  addin:
    name: add-in · typecheck · tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: addin }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: addin/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: tests
        run: npx vitest run
      - name: manifest is well-formed
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('manifest.xml')"

  container:
    name: G0 container import gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (the G0 import gate runs inside the Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: xlforecast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the stack imports in the image
        run: |
          docker run --rm xlforecast:ci python -c "
          import statsforecast, mlforecast, utilsforecast
          print('statsforecast', statsforecast.__version__)
          print('mlforecast   ', mlforecast.__version__)
          print('utilsforecast', utilsforecast.__version__)
          "
